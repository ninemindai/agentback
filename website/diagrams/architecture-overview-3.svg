<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" width="900" height="630" role="img" aria-label="One /mcp endpoint serving both protocol eras: 2026-07-28 and 2025-era clients both reach the stateless default and the legacy session path, and both converge on the same dispatchTool pipeline">
  <!-- Source: docs/architecture/overview.md mermaid block 3 ("Protocol eras: one endpoint, two revisions") -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 z" fill="#8a948d"/>
    </marker>
  </defs>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">

    <!-- ============ edges (under nodes) ============ -->
    <g fill="none" stroke="#8a948d" stroke-width="1.4">
      <!-- both client generations -> the one endpoint -->
      <path d="M295,88 L295,116 L430,116 L430,142" marker-end="url(#arrow)"/>
      <path d="M605,88 L605,116 L470,116 L470,142" marker-end="url(#arrow)"/>
      <!-- endpoint -> protocol switch -->
      <path d="M450,196 L450,218" marker-end="url(#arrow)"/>
      <!-- switch -> the two serving paths -->
      <path d="M388,252 L225,252 L225,330" marker-end="url(#arrow)"/>
      <path d="M512,252 L675,252 L675,330" marker-end="url(#arrow)"/>
      <!-- both paths -> the same dispatch pipeline -->
      <path d="M225,482 L225,508 L390,508 L390,532" marker-end="url(#arrow)"/>
      <path d="M675,482 L675,508 L510,508 L510,532" marker-end="url(#arrow)"/>
    </g>

    <!-- ============ clients ============ -->
    <rect x="170" y="32" width="250" height="56" rx="8" fill="rgba(109,76,168,0.08)" stroke="#6d4ca8" stroke-width="1.5"/>
    <text x="295" y="56" font-size="13" font-weight="600" fill="#17201b" text-anchor="middle">2026-07-28 client</text>
    <text x="295" y="73" font-size="10.5" fill="#5a645e" text-anchor="middle">client@2.0.0</text>

    <rect x="480" y="32" width="250" height="56" rx="8" fill="rgba(109,76,168,0.08)" stroke="#6d4ca8" stroke-width="1.5"/>
    <text x="605" y="56" font-size="13" font-weight="600" fill="#17201b" text-anchor="middle">2025-era client</text>
    <text x="605" y="73" font-size="10.5" fill="#5a645e" text-anchor="middle">sdk 1.11 – 1.29</text>

    <!-- ============ the one endpoint ============ -->
    <rect x="350" y="142" width="200" height="54" rx="8" fill="rgba(8,123,140,0.08)" stroke="#087b8c" stroke-width="1.5"/>
    <text x="450" y="166" font-size="13" font-weight="600" fill="#17201b" text-anchor="middle">POST /mcp</text>
    <text x="450" y="183" font-size="10.5" fill="#5a645e" text-anchor="middle">one URL, both eras</text>

    <!-- ============ protocol switch ============ -->
    <path d="M450,218 L514,252 L450,286 L386,252 z" fill="rgba(155,107,22,0.10)" stroke="#9b6b16" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="450" y="257" font-size="12" font-weight="600" fill="#17201b" text-anchor="middle">protocol</text>

    <!-- edge labels on chips so the lines do not strike through -->
    <rect x="248" y="238" width="118" height="16" rx="3" fill="#f7f8f5"/>
    <text x="307" y="250" font-size="10" fill="#5a645e" text-anchor="middle">'both' — DEFAULT</text>
    <rect x="534" y="238" width="126" height="16" rx="3" fill="#f7f8f5"/>
    <text x="597" y="250" font-size="10" fill="#5a645e" text-anchor="middle">'legacy' — rollback</text>

    <!-- ============ stateless (the default) ============ -->
    <rect x="60" y="330" width="330" height="152" rx="8" fill="rgba(15,107,79,0.08)" stroke="#0f6b4f" stroke-width="1.5"/>
    <text x="225" y="356" font-size="13" font-weight="600" fill="#17201b" text-anchor="middle">createMcpHandler</text>
    <text x="225" y="373" font-size="10.5" fill="#5a645e" text-anchor="middle">one server per REQUEST</text>
    <path d="M84,388 L366,388" stroke="#c5ccc4" stroke-width="1"/>
    <text x="84" y="408" font-size="10" fill="#5a645e">no Mcp-Session-Id</text>
    <text x="84" y="428" font-size="10" fill="#5a645e">GET / DELETE → 405</text>
    <text x="84" y="448" font-size="10" fill="#5a645e">perSession runs per request</text>
    <text x="84" y="468" font-size="10" fill="#5a645e">scales round-robin, no shared store</text>

    <!-- ============ sessions (the rollback) ============ -->
    <rect x="510" y="330" width="330" height="152" rx="8" fill="#ffffff" stroke="#d9ded6" stroke-width="1.5"/>
    <text x="675" y="356" font-size="13" font-weight="600" fill="#17201b" text-anchor="middle">StreamableHTTPServerTransport</text>
    <text x="675" y="373" font-size="10.5" fill="#5a645e" text-anchor="middle">one server per SESSION</text>
    <path d="M534,388 L816,388" stroke="#c5ccc4" stroke-width="1"/>
    <text x="534" y="408" font-size="10" fill="#5a645e">Mcp-Session-Id minted</text>
    <text x="534" y="428" font-size="10" fill="#5a645e">GET / DELETE are session ops</text>
    <text x="534" y="448" font-size="10" fill="#5a645e">perSession runs once</text>
    <text x="534" y="468" font-size="10" fill="#5a645e">eventStore replay works</text>

    <!-- ============ the shared pipeline ============ -->
    <rect x="300" y="532" width="300" height="62" rx="8" fill="rgba(15,107,79,0.08)" stroke="#0f6b4f" stroke-width="1.5"/>
    <text x="450" y="558" font-size="13" font-weight="600" fill="#17201b" text-anchor="middle">MCPServer.dispatchTool</text>
    <text x="450" y="576" font-size="10.5" fill="#5a645e" text-anchor="middle">identical on both paths</text>

  </g>
</svg>
